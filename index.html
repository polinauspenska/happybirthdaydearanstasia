    <script>
      // Heart progress bar: fills as the key images, fonts and page load, never faster than ~2.4s
      // (so she has time to see it) and never slower than ~10s (so it can't get stuck).
      ;(function () {
        var el = document.getElementById('preloader')
        var hearts = el.querySelectorAll('.pl-hearts svg')
        var pct = document.getElementById('pl-pct')
        var start = performance.now(), MIN = 2400, MAX = 10000
        var assets = ['images/theo-hero.webp', 'images/preloader.webp']
        var total = assets.length + 2, done = 0, shown = 0, finished = false
        function tick() { done++ }
        assets.forEach(function (src) { var i = new Image(); i.onload = i.onerror = tick; i.src = src })
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(tick); else tick()
        if (document.readyState === 'complete') tick(); else window.addEventListener('load', tick)
        function frame(now) {
          var t = now - start
          var real = Math.min(1, done / total)
          var target = t > MAX ? 1 : Math.min(real, t / MIN)
          shown += (target - shown) * 0.12
          if (target === 1 && shown > 0.995) shown = 1
          var n = Math.round(shown * hearts.length)
          for (var k = 0; k < hearts.length; k++) hearts[k].classList.toggle('on', k < n)
          pct.textContent = Math.round(shown * 100) + '%'
          if (shown >= 1 && !finished) {
            finished = true
            setTimeout(function () {
              el.classList.add('pl-done')
              window.__preloaderDone = true
              window.dispatchEvent(new Event('preloader-done'))
              setTimeout(function () { el.remove() }, 800)
            }, 350)
            return
          }
          requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)
      })()
    </script>
